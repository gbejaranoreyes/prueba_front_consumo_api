<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacitaciones</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f4f7fb;
      color: #243247;
      font-family: system-ui, sans-serif;
    }

    .contenedor {
      max-width: 1100px;
      margin: 64px auto;
    }

    .etiqueta {
      color: #4263eb;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .panel {
      overflow: hidden;
      background: white;
      border: 1px solid #e5eaf2;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(36, 50, 71, .06);
    }

    .btn-primary {
      background: #4263eb;
      border-color: #4263eb;
      border-radius: 10px;
      padding: 10px 20px;
    }

    .table {
      margin-bottom: 0;
      font-size: .9rem;
    }

    .table thead th {
      background: #f8faff;
      color: #64748b;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .table > :not(caption) > * > * {
      padding: 16px 20px;
      border-bottom-color: #edf1f7;
    }

    .table tbody tr:last-child td {
      border-bottom: 0;
    }

    .table td {
      min-width: 130px;
      max-width: 360px;
      overflow-wrap: anywhere;
    }

    .estado {
      padding: 56px 24px;
      text-align: center;
      color: #64748b;
    }

    @media (max-width: 576px) {
      .contenedor {
        margin: 32px auto;
      }
    }
  </style>
</head>
<body>
  <main class="container contenedor">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <p class="etiqueta mb-2">Panel de consulta</p>
        <h1 class="fw-bold mb-2">Capacitaciones</h1>
        <p class="text-secondary mb-0">
          Consulta los registros disponibles.
        </p>
      </div>

      <button id="cargar" class="btn btn-primary" type="button">
        Actualizar datos
      </button>
    </header>

    <section class="panel" aria-label="Listado de capacitaciones">
      <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
        <h2 class="h6 fw-bold mb-0">Registros</h2>
        <span id="total" class="badge rounded-pill text-bg-light">
          Sin consultar
        </span>
      </div>

      <div id="estado" class="estado" role="status" aria-live="polite">
        Presiona “Actualizar datos” para consultar.
      </div>

      <div id="contenido" class="table-responsive" hidden>
        <table class="table table-hover align-middle">
          <caption class="visually-hidden">
            Capacitaciones disponibles
          </caption>
          <thead id="cabecera"></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_URL =
      "https://wshnjkcvxnevjksrocnq.supabase.co/rest/v1/capacitaciones?select=*";

    const API_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzaG5qa2N2eG5ldmprc3JvY25xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODcxMTYsImV4cCI6MjEwNzA2MzExNn0.4GFjrtT14kZDVTWeH9pMsKxnzzsXw3Kj7iHW7A9mS5k";

    const boton = document.getElementById("cargar");
    const estado = document.getElementById("estado");
    const contenido = document.getElementById("contenido");
    const cabecera = document.getElementById("cabecera");
    const filas = document.getElementById("filas");
    const total = document.getElementById("total");

    function mostrarEstado(mensaje, esError = false) {
      estado.hidden = false;
      contenido.hidden = true;
      estado.textContent = mensaje;
      estado.classList.toggle("text-danger", esError);
    }

    function crearCelda(tipo, valor) {
      const celda = document.createElement(tipo);

      // textContent permite mostrar los datos sin interpretarlos como HTML.
      celda.textContent = valor;

      if (tipo === "th") celda.scope = "col";
      return celda;
    }

    function renderizarTabla(datos) {
      cabecera.replaceChildren();
      filas.replaceChildren();

      total.textContent =
        `${datos.length} ${datos.length === 1 ? "registro" : "registros"}`;

      if (datos.length === 0) {
        mostrarEstado("No hay capacitaciones disponibles.");
        return;
      }

      // Obtiene las columnas directamente de la respuesta de la API.
      const columnas = [...new Set(datos.flatMap(Object.keys))];
      const encabezado = document.createElement("tr");

      columnas.forEach(columna => {
        encabezado.appendChild(
          crearCelda("th", columna.replaceAll("_", " "))
        );
      });

      cabecera.appendChild(encabezado);

      const fragmento = document.createDocumentFragment();

      datos.forEach(registro => {
        const fila = document.createElement("tr");

        columnas.forEach(columna => {
          const valor = registro[columna];
          const texto = valor == null
            ? "—"
            : typeof valor === "object"
              ? JSON.stringify(valor)
              : String(valor);

          fila.appendChild(crearCelda("td", texto));
        });

        fragmento.appendChild(fila);
      });

      filas.appendChild(fragmento);
      estado.hidden = true;
      contenido.hidden = false;
    }

    async function cargarCapacitaciones() {
      boton.disabled = true;
      boton.textContent = "Cargando...";
      total.textContent = "Consultando";
      mostrarEstado("Consultando capacitaciones...");

      try {
        const respuesta = await fetch(API_URL, {
          method: "GET",
          headers: {
            apikey: API_KEY,
            Authorization: `Bearer ${API_KEY}`,
            Accept: "application/json"
          }
        });

        if (!respuesta.ok) {
          throw new Error(`La API respondió con HTTP ${respuesta.status}.`);
        }

        const datos = await respuesta.json();

        if (
          !Array.isArray(datos) ||
          datos.some(item => item === null || typeof item !== "object")
        ) {
          throw new Error("La respuesta no contiene una lista válida.");
        }

        renderizarTabla(datos);
      } catch (error) {
        total.textContent = "Error";
        mostrarEstado(
          `No se pudieron cargar las capacitaciones. ${error.message}`,
          true
        );
      } finally {
        boton.disabled = false;
        boton.textContent = "Actualizar datos";
      }
    }

    boton.addEventListener("click", cargarCapacitaciones);
    cargarCapacitaciones();
  </script>
</body>
</html>
